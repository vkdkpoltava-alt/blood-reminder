<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;background:#fff5f5;color:#222;text-align:center;padding:16px;box-sizing:border-box}
  .card{max-width:360px;width:100%}
  .luck-btn{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 18px;padding:15px 20px;border:2px solid #b8860b;border-radius:10px;background:linear-gradient(135deg,#ffe08a,#d4a017);color:#4a3500;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 8px rgba(120,85,0,.2)}
  #luckLabel{overflow-wrap:anywhere}
  .luck-btn:hover:not(:disabled){filter:brightness(1.04)}
  .luck-btn:disabled{opacity:.85;cursor:default}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .btn{display:block;padding:15px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px}
  .primary{background:#c62828;color:#fff}
  .secondary{background:#fff;color:#c62828;border:2px solid #c62828}
  .hint{font-size:13px;color:#666;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <button type="button" class="luck-btn" id="luckButton"><span aria-hidden="true" id="luckIcon"></span><span id="luckLabel"></span></button>
  <h1 id="heading"></h1>
  <p id="msg"></p>
  <div class="btns" id="btns"></div>
  <p class="hint" id="hint"></p>
</div>

<script>
// ============ НАЛАШТУВАННЯ: змінюйте тільки цей блок ============
var CONFIG = {
  // Текст на сторінці
  pageTitle: "Нагадування про донацію крові",
  heading: "🩸 Дякуємо за донацію!",
  messageTemplate: "Нагадування: {date}.", // {date} замінюється датою події
  hint: "Оберіть свій календар. Подія додасться після підтвердження.",
  googleButton: "Google Календар",
  appleButton: "Apple Календар",

  // Текст події в обох календарях
  eventTitle: "🩸Час здавати кров 🩸",
  eventDescription: "Минуло 60 днів з минулої донації крові. Добрі справи мають продовження. Час планувати нову донацію!",

  // Дата та час
  days: 60,                 // через скільки днів планувати подію
  startTime: "08:00",       // початок події
  endTime: "14:00",         // кінець у звичайний день
  monthEndTime: "13:00",    // кінець в останній день місяця
  reminderMinutes: 0,        // сповіщення за скільки хвилин до початку
  timeZone: "Europe/Kyiv",

  // Кнопка передбачення
  luckButtonText: "Натискай і тобі пощастить",
  prizeIcon: "🏆",
  prizeText: "ПРИЗ!!!",
  prizeProbability: 0.20, // 20% виграшу, решта — передбачення
  predictions: [
    "Те, що сьогодні здається випадковістю, завтра стане доленосним.",
    "Всесвіт готує приємну зустріч — будь відкритим до нових людей.",
    "Незабаром ти отримаєш новину, яка змусить тебе щиро посміхнутися.",
    "Твої зусилля нарешті почнуть приносити відчутні результати.",
    "Маленьке диво трапиться тоді, коли ти найменше цього чекатимеш.",
    "Вітер змін уже поруч — не чіпляйся за старе.",
    "Доля підкаже тобі правильний шлях через дрібну підказку — не проґав її.",
    "Те, що сьогодні здається складним, завтра стане твоєю силою.",
    "Усе, що відбувається зараз, веде тебе до кращої версії себе.",
    "Твоя доброта сьогодні врятувала чиюсь завтрашню посмішку.",
    "Всесвіт бачить твоє добро — і неодмінно поверне його сторицею.",
    "Завдяки тобі цей світ став теплішим і людянішим.",
    "Твоє серце б’ється в унісон із тими, кому ти допомагаєш.",
    "Те, що ти віддаєш, завжди повертається — іноді несподівано, але вчасно.",
    "У твоїх жилах тече не лише кров, а й щирість, сміливість і любов.",
    "Хтось сьогодні живе — завдяки тобі. Це і є справжнє диво.",
    "Твоє добро залишає невидимий, але незгладимий слід у світі.",
    "Донорство — це суперсила, яку маєш ти. Використовуй її з гордістю.",
    "Ти сьогодні не просто людина — ти супергерой без плаща.",
    "Хтось десь зараз каже: “Дякую, доноре!” — навіть якщо ти цього не чуєш.",
    "Після такої доброї справи доля підготує тобі бонус — у вигляді удачі та смаколика.",
    "Твоя суперсила — рятувати життя і виглядати при цьому прекрасно.",
    "Всесвіт сьогодні став на краплю добрішим — саме завдяки тобі.",
    "Донорство — це як заряд енергії для карми. І ти щойно натиснув кнопку «оновити».",
    "Навіть кава після донації здається смачнішою, бо ти сьогодні герой!",
    "Не шукай щастя — воно вже тече у венах добра, яким ти поділився.",
    "Ти зробив добру справу — тепер Всесвіт планує для тебе щось дуже гарне (і, можливо, солодке).",
    "Один донор — сотні можливостей подарувати надію.",
    "Твоя крапля добра — початок великої хвилі змін.",
    "Добро завжди повертається, і ти це побачиш зовсім скоро.",
    "Коли ти ділишся життям — життя ділиться з тобою світлом.",
    "Справжня сила — у здатності допомагати іншим.",
    "Ти сьогодні врятував життя — і життя усміхнеться тобі",
    "Ти даруєш не просто кров — ти даруєш надію 💖",
    "У кожній краплі твоєї доброти хтось знаходить життя.",
    "Світ стає кращим, коли в ньому є такі серця, як твоє ❤️",
    "Твоя доброта непомітна, але безцінна.",
    "Ти — доказ, що добро може текти по венах",
    "Хтось житиме завтра — завдяки твоїй сміливості сьогодні.",
    "Твій вчинок — це історія добра, яку пам’ятають серця.",
    "У кожній краплині твоєї крові — частинка світла.",
    "Твоя доброта тихо творить великі дива.",
    "Ти — промінь тепла у чужому холодному дні.",
    "Добро, яке ти віддав, уже повертається до тебе світлом.",
    "Твій вчинок — це пульс життя, що б’ється десь поруч.",
    "Ти сьогодні зробив більше, ніж здається — ти подарував надію.",
    "Людське серце має межі, але твоя доброта — безмежна.",
    "Ти — доказ, що навіть маленький крок може врятувати світ.",
    "Твій жест сьогодні — чиясь усмішка завтра",
    "Ти довів: щоб рятувати життя, не потрібна магія — достатньо серця.",
    "Сьогодні ти віддав частинку сили — і Всесвіт поверне її у найнеочікуваніший спосіб.",
    "Твоя доброта відкриє двері, про існування яких ти навіть не здогадувався.",
    "На тебе скоро чекає гарна новина — добро завжди приходить удвічі.",
    "Твій сьогоднішній вчинок стане початком приємного ланцюжка подій.",
    "Світ відповість тобі теплом — ти вже запустив хвилю добра.",
    "Невдовзі ти зустрінеш людину, яка щиро оцінить твою чуйність.",
    "Твій внутрішній світ сьогодні став ще світлішим — і це побачать інші.",
    "Попереду день, що подарує відчуття правильності й радості.",
    "Ти рятуєш життя — і життя усміхнеться тобі у відповідь."
  ]
};
// =================================================================

(function () {
  // Необов'язково: ?days=90 у посиланні змінює термін без редагування файлу
  var p = new URLSearchParams(location.search);
  var days = parseInt(p.get("days"), 10) || CONFIG.days;
  var title = p.get("text") || CONFIG.eventTitle;
  var desc = CONFIG.eventDescription;

  var start = new Date();
  start.setDate(start.getDate() + days);
  var weekday = start.getDay();
  if (weekday === 6) start.setDate(start.getDate() + 2); // субота → понеділок
  else if (weekday === 0) start.setDate(start.getDate() + 1); // неділя → понеділок
  var isMonthEnd = new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate() === start.getDate();
  var endTime = isMonthEnd ? CONFIG.monthEndTime : CONFIG.endTime;

  function timeFmt(value) { return value.replace(":", "") + "00"; }

  document.title = CONFIG.pageTitle;
  document.getElementById("heading").textContent = CONFIG.heading;
  document.getElementById("hint").textContent = CONFIG.hint;

  var luckButton = document.getElementById("luckButton");
  var luckLabel = document.getElementById("luckLabel");
  document.getElementById("luckIcon").textContent = CONFIG.prizeIcon;
  luckLabel.textContent = CONFIG.luckButtonText;
  luckButton.addEventListener("click", function () {
    luckButton.disabled = true;
    if (Math.random() < CONFIG.prizeProbability) {
      luckLabel.textContent = CONFIG.prizeText;
    } else {
      var index = Math.floor(Math.random() * CONFIG.predictions.length);
      luckLabel.textContent = CONFIG.predictions[index];
    }
  });

  function fmt(d) {
    return d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, "0") +
      String(d.getDate()).padStart(2, "0");
  }

  document.getElementById("msg").textContent =
    CONFIG.messageTemplate.replace("{date}", start.toLocaleDateString("uk-UA", {day: "numeric", month: "long", year: "numeric"}));

  // Google Calendar
  var gUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(title)
    + "&dates=" + fmt(start) + "T" + timeFmt(CONFIG.startTime) + "/" + fmt(start) + "T" + timeFmt(endTime) + "&ctz=" + encodeURIComponent(CONFIG.timeZone)
    + "&details=" + encodeURIComponent(desc);

  // .ics для Apple Calendar, Outlook та інших
  function esc(s) { return s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  var ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//blood-reminder//UK", "BEGIN:VEVENT",
    "UID:" + Date.now() + "@blood-reminder",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART:" + fmt(start) + "T" + timeFmt(CONFIG.startTime),
    "DTEND:" + fmt(start) + "T" + timeFmt(endTime),
    "SUMMARY:" + esc(title),
    "DESCRIPTION:" + esc(desc),
    "BEGIN:VALARM", "TRIGGER:-PT" + CONFIG.reminderMinutes + "M", "ACTION:DISPLAY", "DESCRIPTION:" + esc(title), "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  var icsUrl = URL.createObjectURL(new Blob([ics], {type: "text/calendar;charset=utf-8"}));

  var isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

  function btn(text, href, cls) {
    var a = document.createElement("a");
    a.className = "btn " + cls;
    a.textContent = text;
    a.href = href;
    return a;
  }

  var google = btn(CONFIG.googleButton, gUrl, isApple ? "secondary" : "primary");
  var apple = btn(CONFIG.appleButton, icsUrl, isApple ? "primary" : "secondary");

  var box = document.getElementById("btns");
  if (isApple) { box.appendChild(apple); box.appendChild(google); }
  else { box.appendChild(google); box.appendChild(apple); }
})();
</script>
</body>
</html>
