<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нагадування про донацію крові</title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;background:#fff5f5;color:#222;text-align:center;padding:16px;box-sizing:border-box}
  .card{max-width:360px;width:100%}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .btn{display:block;padding:15px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px}
  .primary{background:#c62828;color:#fff}
  .secondary{background:#fff;color:#c62828;border:2px solid #c62828}
  .hint{font-size:13px;color:#666;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>🩸 Дякуємо за донацію!</h1>
  <p id="msg"></p>
  <div class="btns" id="btns"></div>
  <p class="hint">Оберіть свій календар. Подія додасться після підтвердження.</p>
</div>

<script>
// ============ НАЛАШТУВАННЯ: змінюйте тільки цей блок ============
var CONFIG = {
  title: "Твоя кров дуже потрібна 🩸",
  description: "Минуло 60 днів після останньої донації. Час прийти на здачу крові!",
  days: 60   // через скільки днів нагадати
};
// =================================================================

(function () {
  // Необов'язково: ?days=90 у посиланні змінює термін без редагування файлу
  var p = new URLSearchParams(location.search);
  var days = parseInt(p.get("days"), 10) || CONFIG.days;
  var title = p.get("text") || CONFIG.title;
  var desc = CONFIG.description;

  var start = new Date();
  start.setDate(start.getDate() + days);
  var end = new Date(start);
  end.setDate(end.getDate() + 1);

  function fmt(d) {
    return d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, "0") +
      String(d.getDate()).padStart(2, "0");
  }

  document.getElementById("msg").textContent =
    "Нагадування: " + start.toLocaleDateString("uk-UA", {day: "numeric", month: "long", year: "numeric"}) + ".";

  // Google Calendar
  var gUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(title)
    + "&dates=" + fmt(start) + "/" + fmt(end)
    + "&details=" + encodeURIComponent(desc);

  // .ics для Apple Calendar, Outlook та інших
  function esc(s) { return s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  var ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//blood-reminder//UK", "BEGIN:VEVENT",
    "UID:" + Date.now() + "@blood-reminder",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART;VALUE=DATE:" + fmt(start),
    "DTEND;VALUE=DATE:" + fmt(end),
    "SUMMARY:" + esc(title),
    "DESCRIPTION:" + esc(desc),
    "BEGIN:VALARM", "TRIGGER:PT9H", "ACTION:DISPLAY", "DESCRIPTION:" + esc(title), "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  var icsUrl = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);

  var isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

  function btn(text, href, cls, download) {
    var a = document.createElement("a");
    a.className = "btn " + cls;
    a.textContent = text;
    a.href = href;
    if (download) a.setAttribute("download", "donor-reminder.ics");
    return a;
  }

  var google = btn("Google Календар", gUrl, isApple ? "secondary" : "primary");
  var apple = btn("Apple Календар / інший (.ics)", icsUrl, isApple ? "primary" : "secondary", true);

  var box = document.getElementById("btns");
  if (isApple) { box.appendChild(apple); box.appendChild(google); }
  else { box.appendChild(google); box.appendChild(apple); }
})();
</script>
</body>
</html>
